# Declarative route grids + risk constraints. Validated by src/models.py::WatchlistFile.
# Anything under `defaults:` can be overridden per watchlist by repeating the block.
#
# Money is in cents. Times are local to the airport. Dates are ISO.
#
# A watchlist is a GRID: origin(s) × destination(s) × depart date(s) × return/trip length.
# It expands to concrete search targets (cap: 60 per watchlist). Each run polls
# `targets_per_run` of them, least-recently-polled first. Run `fares targets` to see
# the expansion and `fares budget` to see calls/day before you commit a change.

version: 1

defaults:
  passengers: 1
  cabin: economy
  currency: USD

  # BUDGET: SerpAPI free tier = 100/month ≈ 3/day. The shipped watchlists sum to exactly 3.
  # Adding a watchlist means lowering another's poll, or paying. `fares budget` tells you.
  poll:
    times_per_day: 1            # ATPCO refiles a few times a day; 1/day is the free-tier reality
    providers: [serpapi]        # amadeus added in Phase 4 once branded-fare mapping is tested
    targets_per_run: 1          # × providers × times_per_day = calls/day for this watchlist
    scan_provider: null         # amadeus cheapest-date scan, Phase 4; one call per O-D pair

  constraints:
    allow_basic_economy: false  # BE is not the same product; reject unless you say otherwise
    max_stops: 1
    max_layover_minutes: 180
    allow_coterminal_swap: false  # arrive JFK, depart EWR → rejected
    reject_overnight_layover: true
    earliest_departure_local: "06:00"
    latest_arrival_local: "23:30"
    allowed_carriers: []        # empty = any
    excluded_carriers: []

  # price <= reference * multiplier  ⇒ strike.
  # References are EXTERNAL (Google's typical band, or your ceiling). Internal
  # stats are not a reference until the dataset earns it (ARCHITECTURE.md).
  strike:
    monitor: { reference: typical_low, multiplier: 0.90 }  # DTD > 65: only true anomalies
    prime:   { reference: typical_low, multiplier: 1.00 }  # 21 < DTD <= 65: the buy window
    fence:   { reference: typical_low, multiplier: 1.15 }  # 14 < DTD <= 21: buckets closing, loosen
    late:    { reference: ceiling,     multiplier: 1.00 }  # DTD <= 14: only your own ceiling

  post_purchase:
    credit_threshold_cents: 2500   # re-fare for credit when the drop is worth the hassle
    dot_window_hours: 24

watchlists:
  # Simple case: one route, fixed dates. Expands to 1 target.
  - id: sea-sjc-thanksgiving
    origin: SEA
    destination: SJC
    depart: 2026-11-25
    return: 2026-11-29
    ceiling_cents: 32000
    status: watching
    poll: { times_per_day: 2, providers: [serpapi], targets_per_run: 1, scan_provider: null }
    notes: Family trip. Alaska or Delta preferred; Southwest fine if bags matter.

  # Flexible destination + trip length: SEA → any Bay Area airport, leave Thu or Fri
  # in a one-week window, stay 3–4 nights.  3 dests × 2 dates × 2 lengths = 12 targets.
  # On the free tier (1 call/day here) each target is refreshed every 12 days — a grid this
  # wide is really a paid-tier feature; it stays as the worked example.
  - id: sea-bayarea-jan-flex
    origin: SEA
    destination: [SJC, SFO, OAK]
    depart: { start: 2027-01-14, end: 2027-01-20, weekdays: [3, 4] }   # 0=Mon … 6=Sun
    trip_length: { min_days: 3, max_days: 4 }
    ceiling_cents: 24000
    status: watching
    poll: { times_per_day: 1, providers: [serpapi], targets_per_run: 1, scan_provider: null }

  # Fixed dates, nonstop only, carrier-restricted. 1 target.
  - id: sea-ord-jan
    origin: SEA
    destination: ORD
    depart: 2027-01-14
    return: 2027-01-18
    ceiling_cents: 38000
    status: paused              # over budget on the free tier; flip to watching when it matters
    constraints:
      allow_basic_economy: false
      max_stops: 0
      max_layover_minutes: 180
      allow_coterminal_swap: false
      reject_overnight_layover: true
      earliest_departure_local: "07:00"
      latest_arrival_local: "22:00"
      allowed_carriers: [AS, UA]
      excluded_carriers: []

  # Post-purchase example (commented out: a purchased watchlist polls its target every run,
  # which the free tier can't spare). A purchase pins ONE target_id; uncomment and fill in
  # from `fares key <observation_id>` when you buy.
  # - id: sea-jfk-march
  #   origin: SEA
  #   destination: [JFK, EWR]
  #   depart: 2027-03-12
  #   return: 2027-03-16
  #   ceiling_cents: 45000
  #   status: purchased
  #   purchase:
  #     purchased_at: 2026-10-15T09:30:00-07:00
  #     price_cents: 41800
  #     currency: USD
  #     itinerary_key: 0123456789abcdef          # from the observation you bought; `fares key <obs id>`
  #     target_id: sea-jfk-march:SEAJFK:2027-03-12:2027-03-16
  #     carrier: DL
  #     changeable: true
