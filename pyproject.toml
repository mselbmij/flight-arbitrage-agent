[project]
name = "flight-arbitrage-agent"
version = "0.1.0"
description = "Risk-aware airline fare tracker: watch routes, reject trap fares, alert in the buy window, harvest post-purchase credits."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "airportsdata>=20240101",  # IATA -> IANA tz; providers return local wall-clock with no offset
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.35",
    "plotly>=5.22",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "respx>=0.21",      # httpx mocking for ingestion tests
    "freezegun>=1.5",   # pin "now" for DTD / regime tests
]

[project.scripts]
fares = "src.runner.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]  # ruff format rewrites fenced code in Markdown; the briefs are prose

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]  # long lines in docstrings / yaml examples

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits a real provider API (never run in CI; burns quota)",
]
